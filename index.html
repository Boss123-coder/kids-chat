<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SafeKids Chat</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
    body { background: #14171f; color: #f3f4f6; height: 100vh; display: flex; flex-direction: column; }
    .hidden { display: none !important; }

    /* Entry */
    .entry { margin: auto; width: 100%; max-width: 380px; background: #1e232e; padding: 20px; border-radius: 14px; border: 1px solid #2d3546; }
    .entry h2 { text-align: center; margin-bottom: 14px; font-size: 20px; }
    .entry h2 span { color: #fbbf24; }
    label { display: block; font-size: 11px; color: #9ca3af; margin: 10px 0 4px; text-transform: uppercase; }
    input, select { width: 100%; padding: 9px 11px; border-radius: 8px; border: 1px solid #374151; background: #12151c; color: #fff; font-size: 13px; }
    .avs { display: flex; justify-content: space-between; gap: 6px; }
    .av { flex: 1; padding: 7px 0; border-radius: 8px; border: 1px solid #374151; background: #12151c; font-size: 18px; cursor: pointer; }
    .av.on { border-color: #10b981; background: #064e3b; }
    .adm { margin-top: 12px; padding: 10px; border-radius: 8px; background: rgba(251,191,36,0.08); border: 1px solid rgba(251,191,36,0.3); }
    .adm-top { display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: #fbbf24; font-weight: 700; }
    .btn { width: 100%; margin-top: 14px; padding: 10px; border: none; border-radius: 8px; background: #10b981; color: #fff; font-weight: 700; cursor: pointer; }
    .err { color: #f87171; font-size: 12px; margin-top: 8px; min-height: 16px; }

    /* Chat */
    .app { display: flex; flex-direction: column; height: 100vh; }
    .top { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; padding: 8px 12px; background: #0f1218; border-bottom: 1px solid #262d3d; font-size: 12px; }
    .badge { padding: 3px 8px; border-radius: 99px; background: #1f2937; border: 1px solid #374151; font-weight: 700; }
    .sbtn { padding: 5px 9px; border-radius: 7px; border: 1px solid #374151; background: #1f2937; color: #fff; font-size: 12px; cursor: pointer; }
    .sbtn.gold { border-color: #fbbf24; color: #fde68a; background: rgba(251,191,36,0.15); }
    .sbtn.red { border-color: #f87171; color: #fca5a5; background: rgba(239,68,68,0.15); }
    .sbtn.grn { border-color: #34d399; color: #6ee7b7; background: rgba(16,185,129,0.15); }

    .main { flex: 1; display: grid; grid-template-columns: 200px 1fr; min-height: 0; }
    @media (max-width: 700px) { .main { grid-template-columns: 1fr; } .side { display: none; } }
    .side { background: #12151d; border-right: 1px solid #262d3d; padding: 10px; overflow-y: auto; font-size: 12px; }
    .u-item { padding: 7px; border-radius: 8px; background: #1a1f2b; margin-bottom: 7px; }
    .sub { font-size: 10px; color: #9ca3af; margin-top: 2px; word-break: break-all; }

    .col { position: relative; display: flex; flex-direction: column; min-height: 0; }
    .msgs { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
    .m { background: #1c212c; border: 1px solid #2a3142; border-radius: 10px; padding: 8px 10px; font-size: 13px; }
    .m-top { display: flex; gap: 6px; align-items: center; font-size: 11px; margin-bottom: 4px; color: #d1d5db; }
    .m img { max-width: 200px; max-height: 160px; border-radius: 8px; margin-top: 6px; display: block; }
    .m iframe { width: 100%; max-width: 290px; height: 165px; border: none; border-radius: 8px; margin-top: 6px; display: block; }

    .tools { position: absolute; bottom: 52px; left: 10px; width: 320px; max-width: calc(100% - 20px); background: #1e232e; border: 1px solid #374151; border-radius: 10px; padding: 10px; z-index: 20; }
    .m-res { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; margin-top: 6px; max-height: 150px; overflow-y: auto; }
    .m-card { background: #12151c; border: 1px solid #2d3546; border-radius: 6px; padding: 3px; text-align: center; font-size: 10px; cursor: pointer; }
    .m-card img { width: 100%; height: 48px; object-fit: cover; border-radius: 4px; display: block; }

    .foot { display: flex; gap: 6px; padding: 8px 10px; background: #0f1218; border-top: 1px solid #262d3d; }

    .pop { position: fixed; inset: 0; background: rgba(0,0,0,0.7); display: flex; align-items: center; justify-content: center; padding: 14px; z-index: 40; }
    .pop-box { width: 100%; max-width: 460px; max-height: 80vh; overflow-y: auto; background: #1c212c; border: 1px solid #374151; border-radius: 12px; padding: 14px; }
    .mod-line { display: flex; justify-content: space-between; align-items: center; gap: 6px; flex-wrap: wrap; padding: 7px 0; border-bottom: 1px solid #2a3142; font-size: 12px; }
  </style>
</head>
<body>

  <div id="entry" class="entry">
    <h2>SafeKids <span>Chat</span></h2>
    <label>Nickname</label>
    <input id="nick" type="text" maxlength="20" placeholder="Your name..." />

    <label>Avatar</label>
    <div id="avs" class="avs"></div>

    <label>Room</label>
    <select id="room">
      <option value="Kids Lounge">Kids Lounge</option>
      <option value="Teen Chat">Teen Chat</option>
      <option value="Memes Room">Memes Room</option>
    </select>

    <div class="adm">
      <div class="adm-top">
        <span>Admin (Unlimited Coins)</span>
        <label style="margin:0; display:inline-flex; gap:5px; cursor:pointer; color:#fde68a; text-transform:none;">
          <input id="admChk" type="checkbox" style="width:auto;" /> Claim Admin
        </label>
      </div>
      <div id="admKeyBox" class="hidden" style="margin-top:8px;">
        <input id="admKey" type="password" placeholder="Secret key: ADMIN123" />
      </div>
    </div>

    <button id="goBtn" class="btn" type="button">Enter Chat</button>
    <div id="err" class="err"></div>
  </div>

  <div id="app" class="app hidden">
    <div class="top">
      <div style="display:flex; gap:6px; align-items:center; flex-wrap:wrap;">
        <strong id="rName">Room</strong>
        <span id="rBadge" class="badge">Member</span>
        <span class="badge">EXP: <span id="expN">0</span></span>
        <span class="badge">Coins: <span id="coinN">0</span></span>
      </div>
      <div style="display:flex; gap:6px;">
        <button id="admBtn" class="sbtn gold hidden" type="button">Admin</button>
        <button id="outBtn" class="sbtn" type="button">Logout</button>
      </div>
    </div>

    <div class="main">
      <div class="side">
        <div class="sub" style="font-weight:700; margin-bottom:8px;">ONLINE</div>
        <div id="uList"></div>
      </div>

      <div class="col">
        <div id="msgs" class="msgs"></div>

        <div id="tools" class="tools hidden">
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">
            <strong style="font-size:12px;">Memes (Free for VIP+)</strong>
            <button id="closeTools" class="sbtn" type="button">x</button>
          </div>
          <div style="display:flex; gap:5px;">
            <input id="mSearch" type="text" placeholder="Search meme..." />
            <button id="mBtn" class="sbtn grn" type="button">Find</button>
          </div>
          <div id="mRes" class="m-res"></div>

          <div style="display:flex; gap:5px; margin-top:7px;">
            <input id="ytInp" type="text" placeholder="YouTube link or ID..." />
            <button id="ytBtn" class="sbtn grn" type="button">YT</button>
          </div>

          <div style="display:flex; gap:5px; margin-top:7px;">
            <input id="giftTo" type="text" placeholder="Gift to user (20 coins)..." />
            <button id="giftBtn" class="sbtn gold" type="button">Gift 20</button>
          </div>
        </div>

        <form id="mForm" class="foot">
          <button id="plusBtn" class="sbtn" type="button">+</button>
          <input id="mInp" type="text" maxlength="300" placeholder="Message (+10 EXP, +5 Coins)..." autocomplete="off" />
          <button class="sbtn grn" type="submit">Send</button>
        </form>
      </div>
    </div>
  </div>

  <div id="admPop" class="pop hidden">
    <div class="pop-box">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
        <strong>Admin Moderation</strong>
        <button id="closeAdm" class="sbtn" type="button">x</button>
      </div>
      <div class="sub" style="font-weight:700;">USERS</div>
      <div id="admUsers"></div>
      <div class="sub" style="font-weight:700; margin-top:10px;">BANNED</div>
      <div id="admBanned"></div>
    </div>
  </div>

  <script>
    const DB = "https://safekids-chat-default-rtdb.firebaseio.com";
    const AVS = ["😎", "🦊", "🐼", "🚀", "👑", "⚡"];
    const RANKS = ["Member", "Bronze", "Gold", "VIP", "Diamond", "Super VIP", "Moderator", "Room Manager"];
    const VIP_UP = ["VIP", "Diamond", "Super VIP", "Moderator", "Room Manager", "Admin"];
    const KEY = "ADMIN123";
    const BACKUP_MEMES = [
      { t: "Cat", u: "https://media.giphy.com/media/JIX9t1j0ZtnJetCPas/giphy.gif" },
      { t: "Gamer", u: "https://media.giphy.com/media/l0MYt5jPR6QX5pnqM/giphy.gif" },
      { t: "Fire", u: "https://media.giphy.com/media/26AHONQ79FdWTrAIy/giphy.gif" }
    ];

    let devId = localStorage.getItem("sk_dev_clean");
    if (!devId) { devId = "D-" + Math.random().toString(36).slice(2, 7).toUpperCase(); localStorage.setItem("sk_dev_clean", devId); }

    let av = AVS[0], me = null;
    let users = {}, banned = {}, ranks = {}, stats = {}, msgs = {};

    const avBox = document.getElementById("avs");
    AVS.forEach((e, i) => {
      const b = document.createElement("button");
      b.type = "button"; b.className = "av" + (i === 0 ? " on" : ""); b.textContent = e;
      b.onclick = () => { av = e; document.querySelectorAll(".av").forEach(x => x.classList.remove("on")); b.classList.add("on"); };
      avBox.appendChild(b);
    });

    const admChk = document.getElementById("admChk");
    const admKeyBox = document.getElementById("admKeyBox");
    function syncAdmBox() { admKeyBox.classList.toggle("hidden", !admChk.checked); }
    admChk.addEventListener("change", syncAdmBox);
    admChk.addEventListener("click", syncAdmBox);

    const kOf = s => encodeURIComponent(String(s || "").toLowerCase().trim());
    const getR = u => !u ? "Member" : (u.isAdmin ? "Admin" : (ranks[kOf(u.name)] || "Member"));

    async function apiGet(p) { const r = await fetch(`${DB}/${p}.json`); return r.ok ? await r.json() : null; }
    async function apiPut(p, d) { await fetch(`${DB}/${p}.json`, { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify(d) }); }
    async function apiDel(p) { await fetch(`${DB}/${p}.json`, { method: "DELETE" }); }

    function drawMemes(list) {
      const box = document.getElementById("mRes"); box.innerHTML = "";
      list.forEach(item => {
        const c = document.createElement("div"); c.className = "m-card";
        c.innerHTML = `<img src="${item.u}" alt="" /><div>${item.t}</div>`;
        c.onclick = async () => {
          if (!me || !VIP_UP.includes(getR(me))) return alert("Memes free sirf VIP+ rank par send hote hain.");
          document.getElementById("tools").classList.add("hidden");
          await sendMsg({ text: item.t, img: item.u }, false);
        };
        box.appendChild(c);
      });
    }

    async function findMemes(q = "") {
      const s = q.trim();
      try {
        const url = s
          ? `https://g.tenor.com/v1/search?q=${encodeURIComponent(s + " meme")}&key=LIVDSRZULELA&limit=9`
          : `https://g.tenor.com/v1/trending?key=LIVDSRZULELA&limit=9`;
        const res = await fetch(url);
        const data = await res.json();
        const out = (data.results || []).map(x => {
          const g = x.media && x.media[0] && (x.media[0].tinygif || x.media[0].gif);
          return g ? { t: x.content_description || s || "Meme", u: g.url } : null;
        }).filter(Boolean);
        if (out.length) return drawMemes(out);
      } catch (_) {}
      drawMemes(BACKUP_MEMES);
    }
    findMemes("");

    document.getElementById("mBtn").onclick = () => findMemes(document.getElementById("mSearch").value);
    document.getElementById("mSearch").addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); findMemes(e.target.value); } });

    function ytId(v) {
      const s = (v || "").trim();
      if (/^[a-zA-Z0-9_-]{11}$/.test(s)) return s;
      const m = s.match(/(?:v=|youtu\.be\/|embed\/|shorts\/)([a-zA-Z0-9_-]{11})/);
      return m ? m[1] : null;
    }

    document.getElementById("ytBtn").onclick = async () => {
      const id = ytId(document.getElementById("ytInp").value);
      if (!id) return alert("Valid YouTube link ya ID dein.");
      document.getElementById("ytInp").value = "";
      document.getElementById("tools").classList.add("hidden");
      await sendMsg({ text: "YouTube", yt: id }, false);
    };

    document.getElementById("giftBtn").onclick = async () => {
      if (!me) return;
      const to = document.getElementById("giftTo").value.trim();
      if (!to) return;
      const cost = 20;
      const myK = kOf(me.name);
      const mySt = stats[myK] || { exp: 0, coins: 0 };

      if (!me.isAdmin) {
        if (Number(mySt.coins || 0) < cost) return alert("Coins kam hain.");
        await apiPut(`stats/${myK}`, { exp: Number(mySt.exp || 0), coins: Number(mySt.coins || 0) - cost });
      }
      const toK = kOf(to);
      const toSt = stats[toK] || { exp: 0, coins: 0 };
      await apiPut(`stats/${toK}`, { exp: Number(toSt.exp || 0) + 10, coins: Number(toSt.coins || 0) + cost });

      document.getElementById("giftTo").value = "";
      document.getElementById("tools").classList.add("hidden");
      await sendMsg({ text: `Gift 20 Coins -> ${to}` }, false);
    };

    async function loop() {
      const [u, b, r, s, m] = await Promise.all([apiGet("users"), apiGet("banned"), apiGet("ranks"), apiGet("stats"), apiGet("messages")]);
      users = u || {}; banned = b || {}; ranks = r || {}; stats = s || {}; msgs = m || {};
      if (me && !me.isAdmin) {
        const isB = Object.values(banned).some(x => x && (x.devId === devId || (x.name && x.name.toLowerCase() === me.name.toLowerCase())));
        const isA = Object.values(users).some(x => x && x.name === me.name && x.devId === devId);
        if (isB || !isA) {
          me = null;
          document.getElementById("app").classList.add("hidden");
          document.getElementById("entry").classList.remove("hidden");
          document.getElementById("err").textContent = isB ? "Banned by Admin." : "Kicked by Admin.";
        }
      }
      render();
    }

    document.getElementById("goBtn").onclick = async () => {
      const name = document.getElementById("nick").value.trim();
      const room = document.getElementById("room").value;
      const err = document.getElementById("err");
      err.textContent = "";
      if (!name) return (err.textContent = "Nickname likhein.");

      const [b, u, r, s] = await Promise.all([apiGet("banned"), apiGet("users"), apiGet("ranks"), apiGet("stats")]);
      banned = b || {}; users = u || {}; ranks = r || {}; stats = s || {};

      const isB = Object.values(banned).some(x => x && (x.devId === devId || (x.name && x.name.toLowerCase() === name.toLowerCase())));
      if (isB && !admChk.checked) return (err.textContent = "Banned.");

      let isAdmin = false;
      if (admChk.checked) {
        if (document.getElementById("admKey").value !== KEY) return (err.textContent = "Wrong key (ADMIN123).");
        isAdmin = true;
      }

      const otherSameDev = Object.values(users).find(x => x && x.devId === devId && x.name.toLowerCase() !== name.toLowerCase());
      if (!isAdmin && otherSameDev) return (err.textContent = `1 device = 1 account (${otherSameDev.name} active).`);

      for (const [key, val] of Object.entries(users)) {
        if (val && val.name && val.name.toLowerCase() === name.toLowerCase() && key !== devId) {
          await apiDel("users/" + key);
        }
      }

      const rk = isAdmin ? "Admin" : (ranks[kOf(name)] && ranks[kOf(name)] !== "Admin" ? ranks[kOf(name)] : "Member");
      await apiPut("ranks/" + kOf(name), rk);
      if (!stats[kOf(name)]) await apiPut("stats/" + kOf(name), { exp: 0, coins: 0 });

      me = { name, av, room, isAdmin, devId };
      await apiPut("users/" + devId, me);

      document.getElementById("entry").classList.add("hidden");
      document.getElementById("app").classList.remove("hidden");
      render();
    };

    function render() {
      if (!me) return;
      const mySt = stats[kOf(me.name)] || { exp: 0, coins: 0 };
      document.getElementById("rName").textContent = `${me.av} ${me.name} — ${me.room}`;
      document.getElementById("rBadge").textContent = getR(me);
      document.getElementById("expN").textContent = mySt.exp || 0;
      document.getElementById("coinN").textContent = me.isAdmin ? "∞" : (mySt.coins || 0);
      document.getElementById("admBtn").classList.toggle("hidden", !me.isAdmin);

      const uList = document.getElementById("uList"); uList.innerHTML = "";
      Object.values(users).forEach(u => {
        if (!u) return;
        const st = stats[kOf(u.name)] || { exp: 0, coins: 0 };
        const d = document.createElement("div"); d.className = "u-item";
        d.innerHTML = `<strong>${u.av} ${u.name}</strong> (${getR(u)})<div class="sub">EXP ${st.exp || 0} • Coins ${u.isAdmin ? "∞" : (st.coins || 0)}</div><div class="sub">${u.devId}</div>`;
        uList.appendChild(d);
      });

      const mBox = document.getElementById("msgs"); mBox.innerHTML = "";
      Object.values(msgs[kOf(me.room)] || {}).forEach(m => {
        if (!m) return;
        const d = document.createElement("div"); d.className = "m";
        const img = m.img ? `<img src="${m.img}" alt="" />` : "";
        const yt = m.yt ? `<iframe src="https://www.youtube.com/embed/${m.yt}" allowfullscreen></iframe>` : "";
        d.innerHTML = `<div class="m-top"><strong>${m.av} ${m.sender}</strong><span>[${m.role}]</span><span>${m.time || ""}</span></div><div>${m.text || ""}</div>${img}${yt}`;
        mBox.appendChild(d);
      });
      mBox.scrollTop = mBox.scrollHeight;

      if (!document.getElementById("admPop").classList.contains("hidden")) drawAdm();
    }

    async function sendMsg({ text = "", img = "", yt = "" }, earn = true) {
      if (!me) return;
      const k = kOf(me.name);
      if (earn) {
        const prev = stats[k] || { exp: 0, coins: 0 };
        const next = { exp: Number(prev.exp || 0) + 10, coins: me.isAdmin ? "∞" : Number(prev.coins || 0) + 5 };
        stats[k] = next;
        await apiPut("stats/" + k, next);
      }
      const id = "MSG_" + Date.now();
      const row = { sender: me.name, av: me.av, role: getR(me), text, img, yt, time: new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }) };
      msgs[kOf(me.room)] = msgs[kOf(me.room)] || {};
      msgs[kOf(me.room)][id] = row;
      await apiPut(`messages/${kOf(me.room)}/${id}`, row);
      render();
    }

    document.getElementById("mForm").onsubmit = async e => {
      e.preventDefault();
      const inp = document.getElementById("mInp");
      const t = inp.value.trim();
      if (!t) return;
      inp.value = "";
      await sendMsg({ text: t }, true);
    };

    document.getElementById("plusBtn").onclick = () => document.getElementById("tools").classList.toggle("hidden");
    document.getElementById("closeTools").onclick = () => document.getElementById("tools").classList.add("hidden");

    document.getElementById("admBtn").onclick = () => { drawAdm(); document.getElementById("admPop").classList.remove("hidden"); };
    document.getElementById("closeAdm").onclick = () => document.getElementById("admPop").classList.add("hidden");

    function drawAdm() {
      const uDiv = document.getElementById("admUsers"); const bDiv = document.getElementById("admBanned");
      uDiv.innerHTML = ""; bDiv.innerHTML = "";
      const list = Object.entries(users).filter(([k, u]) => u && k !== devId);
      if (!list.length) uDiv.innerHTML = `<div class="sub">No other users.</div>`;
      list.forEach(([key, u]) => {
        const row = document.createElement("div"); row.className = "mod-line";
        row.innerHTML = `<div><strong>${u.name}</strong><div class="sub">${key}</div></div>`;
        const acts = document.createElement("div"); acts.style.display = "flex"; acts.style.gap = "4px";

        const sel = document.createElement("select"); sel.style.width = "105px"; sel.style.padding = "4px";
        RANKS.forEach(r => { const o = document.createElement("option"); o.value = r; o.textContent = r; if ((ranks[kOf(u.name)] || "Member") === r) o.selected = true; sel.appendChild(o); });
        sel.onchange = async () => { await apiPut("ranks/" + kOf(u.name), sel.value); loop(); };

        const kick = document.createElement("button"); kick.type = "button"; kick.className = "sbtn gold"; kick.textContent = "Kick";
        kick.onclick = async () => { await apiDel("users/" + key); delete users[key]; render(); };

        const ban = document.createElement("button"); ban.type = "button"; ban.className = "sbtn red"; ban.textContent = "Ban";
        ban.onclick = async () => {
          await apiDel("users/" + key); delete users[key];
          const bObj = { name: u.name, devId: u.devId || key };
          banned[key] = bObj;
          await apiPut("banned/" + key, bObj);
          render();
        };

        acts.append(sel, kick, ban); row.appendChild(acts); uDiv.appendChild(row);
      });

      const bList = Object.entries(banned);
      if (!bList.length) bDiv.innerHTML = `<div class="sub">None</div>`;
      bList.forEach(([k, b]) => {
        if (!b) return;
        const row = document.createElement("div"); row.className = "mod-line";
        row.innerHTML = `<div><strong>${b.name}</strong> <span class="sub">(${b.devId})</span></div>`;
        const un = document.createElement("button"); un.type = "button"; un.className = "sbtn grn"; un.textContent = "Unban";
        un.onclick = async () => { await apiDel("banned/" + k); delete banned[k]; drawAdm(); };
        row.appendChild(un); bDiv.appendChild(row);
      });
    }

    document.getElementById("outBtn").onclick = async () => {
      if (me) { await apiDel("users/" + devId); delete users[devId]; }
      me = null;
      document.getElementById("app").classList.add("hidden");
      document.getElementById("entry").classList.remove("hidden");
    };

    setInterval(loop, 2500);
  </script>
</body>
</html>
