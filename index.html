<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SafeKids Chat — All-World GIFs, Stickers & Admin Room</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
    body { height: 100vh; overflow: hidden; background: #0d0b14; color: #f3f4f6; }
    .hidden { display: none !important; }

    /* Entry Screen */
    .entry-bg {
      height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px;
      background:
        radial-gradient(circle at 25% 25%, rgba(168, 85, 247, 0.28), transparent 45%),
        radial-gradient(circle at 80% 75%, rgba(236, 72, 153, 0.22), transparent 45%),
        linear-gradient(135deg, #120d1d 0%, #1c132b 55%, #0c0a12 100%);
    }
    .entry-box {
      width: 100%; max-width: 390px;
      background: rgba(24, 19, 36, 0.94); border: 1px solid rgba(255,255,255,0.12);
      border-radius: 16px; padding: 20px; box-shadow: 0 24px 60px rgba(0,0,0,0.75);
    }
    .entry-title { text-align: center; font-size: 21px; font-weight: 800; margin-bottom: 14px; }
    .entry-title span { color: #c084fc; }
    .lbl { display: block; font-size: 11px; font-weight: 700; color: #a1a1aa; text-transform: uppercase; margin: 10px 0 4px; }
    .inp, .sel {
      width: 100%; padding: 9px 11px; border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.14); background: #110e1a; color: #fff; font-size: 13px; outline: none;
    }
    .inp:focus, .sel:focus { border-color: #a855f7; }
    .sel option { background: #181324; color: #fff; }
    .avs { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
    .av {
      padding: 7px 0; border-radius: 8px; border: 1px solid rgba(255,255,255,0.12);
      background: #110e1a; font-size: 18px; cursor: pointer;
    }
    .av.on { border-color: #a855f7; background: rgba(168,85,247,0.25); }
    .adm-card {
      margin-top: 12px; padding: 10px 12px; border-radius: 10px;
      background: rgba(251,191,36,0.08); border: 1px solid rgba(251,191,36,0.35);
    }
    .adm-row { display: flex; justify-content: space-between; align-items: center; font-size: 12px; font-weight: 700; color: #fbbf24; }
    .go-btn {
      width: 100%; margin-top: 14px; padding: 11px; border: none; border-radius: 9px;
      background: linear-gradient(90deg, #9333ea, #db2777); color: #fff; font-weight: 700; font-size: 14px; cursor: pointer;
    }
    .err { color: #f87171; font-size: 12px; margin-top: 8px; min-height: 16px; }

    /* Main Chat Layout (Left Feed + Center Stage + Right Users) */
    .room-shell { display: flex; flex-direction: column; height: 100vh; }
    .top-bar {
      height: 42px; display: flex; align-items: center; justify-content: space-between; gap: 8px;
      padding: 0 12px; background: #141020; border-bottom: 1px solid rgba(255,255,255,0.09); font-size: 12px;
    }
    .chip {
      padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 700;
      background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.12);
    }
    .tbtn {
      padding: 4px 9px; border-radius: 7px; border: 1px solid rgba(255,255,255,0.14);
      background: rgba(255,255,255,0.07); color: #fff; font-size: 11px; font-weight: 600; cursor: pointer;
    }
    .tbtn.gold { border-color: #fbbf24; color: #fde68a; background: rgba(251,191,36,0.16); }
    .tbtn.red { border-color: #f87171; color: #fca5a5; background: rgba(239,68,68,0.16); }
    .tbtn.grn { border-color: #34d399; color: #6ee7b7; background: rgba(16,185,129,0.16); }

    .grid-3 { flex: 1; display: grid; grid-template-columns: 270px 1fr 220px; min-height: 0; }
    @media (max-width: 900px) {
      .grid-3 { grid-template-columns: 1fr; }
      .center-stage, .right-panel { display: none; }
    }

    /* Left Chat Panel */
    .left-chat {
      display: flex; flex-direction: column; min-height: 0; position: relative;
      background: #171324; border-right: 1px solid rgba(255,255,255,0.09);
    }
    .feed { flex: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
    .bubble-item {
      background: #231d36; border: 1px solid rgba(255,255,255,0.07);
      border-radius: 10px; padding: 8px 10px; font-size: 12px;
    }
    .b-meta { display: flex; align-items: center; gap: 6px; margin-bottom: 4px; font-size: 11px; }
    .b-text { font-size: 13px; line-height: 1.35; word-break: break-word; }
    .b-img { max-width: 190px; max-height: 150px; border-radius: 8px; margin-top: 6px; display: block; }
    .b-yt { width: 100%; height: 155px; border: none; border-radius: 8px; margin-top: 6px; display: block; }

    /* Center Geometric Stage */
    .center-stage {
      position: relative;
      background:
        radial-gradient(circle at 22% 28%, rgba(168, 85, 247, 0.35), transparent 42%),
        radial-gradient(circle at 78% 72%, rgba(236, 72, 153, 0.25), transparent 45%),
        linear-gradient(135deg, #1b122b 0%, #2a163d 50%, #120d1d 100%);
      display: flex; align-items: flex-end; justify-content: flex-end; padding: 14px;
    }
    .stage-tools { display: flex; gap: 6px; background: rgba(17,13,28,0.85); padding: 8px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.12); }

    /* Right Users Panel */
    .right-panel {
      background: #141020; border-left: 1px solid rgba(255,255,255,0.09);
      padding: 10px; overflow-y: auto; font-size: 12px;
    }
    .sec-hdr {
      background: rgba(255,255,255,0.06); padding: 5px 8px; border-radius: 6px;
      font-size: 11px; font-weight: 800; text-align: center; margin: 8px 0 6px; color: #e9d5ff;
    }
    .u-row { display: flex; align-items: center; justify-content: space-between; gap: 6px; padding: 6px; border-radius: 8px; background: rgba(255,255,255,0.03); margin-bottom: 5px; }
    .tiny { font-size: 10px; color: #9ca3af; word-break: break-all; }

    /* Gifs / Stickers Popup (Matching Image 2) */
    .gif-popup {
      position: absolute; bottom: 52px; left: 8px; width: 295px; max-width: calc(100% - 16px);
      background: #1b152b; border: 1px solid rgba(255,255,255,0.16);
      border-radius: 12px; padding: 10px; box-shadow: 0 18px 40px rgba(0,0,0,0.8); z-index: 35;
    }
    .tabs-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .tab-btn {
      padding: 5px 11px; border-radius: 7px; border: none; background: transparent;
      color: #d1d5db; font-size: 12px; font-weight: 700; cursor: pointer;
    }
    .tab-btn.active { background: #2d2446; color: #fff; }
    .search-gif {
      width: 100%; padding: 8px 10px; border-radius: 8px;
      border: 1px solid rgba(244,114,182,0.5); background: #241226; color: #fff; font-size: 12px; outline: none;
    }
    .gif-results {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px;
      margin-top: 8px; max-height: 170px; overflow-y: auto;
    }
    .g-tile {
      background: #120e1d; border: 1px solid rgba(255,255,255,0.1);
      border-radius: 7px; padding: 4px; text-align: center; font-size: 10px; cursor: pointer;
    }
    .g-tile img { width: 100%; height: 54px; object-fit: cover; border-radius: 5px; display: block; margin-bottom: 2px; }

    /* Bottom Composer */
    .composer-bar {
      height: 46px; display: flex; align-items: center; gap: 6px;
      padding: 0 8px; background: #120e1c; border-top: 1px solid rgba(255,255,255,0.1);
    }

    /* Admin Modal */
    .modal-bg {
      position: fixed; inset: 0; background: rgba(0,0,0,0.75);
      display: flex; align-items: center; justify-content: center; padding: 14px; z-index: 60;
    }
    .modal-box {
      width: 100%; max-width: 480px; max-height: 82vh; overflow-y: auto;
      background: #1b1629; border: 1px solid rgba(251,191,36,0.35); border-radius: 14px; padding: 16px;
    }
    .mod-item {
      display: flex; justify-content: space-between; align-items: center; gap: 6px; flex-wrap: wrap;
      padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,0.08); font-size: 12px;
    }
  </style>
</head>
<body>

  <!-- ENTRY SCREEN -->
  <div id="entryScreen" class="entry-bg">
    <div class="entry-box">
      <div class="entry-title">SafeKids <span>Chat</span></div>

      <label class="lbl" for="nickInp">Nickname</label>
      <input id="nickInp" class="inp" type="text" maxlength="20" placeholder="Enter nickname..." />

      <label class="lbl">Avatar</label>
      <div id="avGrid" class="avs"></div>

      <label class="lbl" for="roomSel">Chat Room</label>
      <select id="roomSel" class="sel">
        <option value="AllTeen Lounge">AllTeen Lounge</option>
        <option value="Kids Lounge">Kids Lounge</option>
        <option value="Memes & GIFs">Memes & GIFs</option>
      </select>

      <div class="adm-card">
        <div class="adm-row">
          <span>Admin (Unlimited Coins)</span>
          <label style="display:inline-flex; align-items:center; gap:5px; cursor:pointer; color:#fde68a;">
            <input id="admToggle" type="checkbox" /> Claim Admin
          </label>
        </div>
        <div id="admKeyWrap" class="hidden" style="margin-top:8px;">
          <input id="admKeyInp" class="inp" type="password" placeholder="Secret Key: ADMIN123" />
        </div>
      </div>

      <button id="enterBtn" class="go-btn" type="button">Enter Chat</button>
      <div id="entryErr" class="err"></div>
    </div>
  </div>

  <!-- ROOM SCREEN -->
  <div id="roomScreen" class="room-shell hidden">
    <header class="top-bar">
      <div style="display:flex; align-items:center; gap:7px; flex-wrap:wrap;">
        <strong id="roomHeading">Room</strong>
        <span id="rankChip" class="chip">Member</span>
        <span class="chip">EXP: <span id="myExp">0</span></span>
        <span class="chip">Coins: <span id="myCoins">0</span></span>
      </div>
      <div style="display:flex; gap:6px;">
        <button id="openAdmBtn" class="tbtn gold hidden" type="button">Admin Panel</button>
        <button id="logoutBtn" class="tbtn" type="button">Logout</button>
      </div>
    </header>

    <div class="grid-3">
      <!-- Left Chat -->
      <section class="left-chat">
        <div id="chatFeed" class="feed"></div>

        <!-- Gifs / Stickers Search Popup -->
        <div id="gifPopup" class="gif-popup hidden">
          <div class="tabs-top">
            <div style="display:flex; gap:4px;">
              <button id="tabGifs" class="tab-btn active" type="button">Gifs</button>
              <button id="tabStickers" class="tab-btn" type="button">Stickers</button>
            </div>
            <button id="closeGifPopup" class="tbtn" type="button">✕</button>
          </div>
          <input id="gifSearchInp" class="search-gif" type="text" placeholder="Search" />
          <div id="gifResults" class="gif-results"></div>
        </div>

        <form id="msgForm" class="composer-bar">
          <button id="openGifBtn" class="tbtn" type="button" title="Gifs & Stickers">+</button>
          <input id="msgInp" class="inp" type="text" maxlength="300" placeholder="Type here..." autocomplete="off" />
          <button class="tbtn grn" type="submit">Send</button>
        </form>
      </section>

      <!-- Center Stage with YouTube & Gift Controls -->
      <main class="center-stage">
        <div class="stage-tools">
          <input id="ytUrlInp" class="inp" style="width:145px; padding:6px 8px;" type="text" placeholder="YouTube link/ID..." />
          <button id="sendYtBtn" class="tbtn grn" type="button">▶ YT</button>
          <input id="giftUserInp" class="inp" style="width:115px; padding:6px 8px;" type="text" placeholder="Gift user..." />
          <button id="sendGiftBtn" class="tbtn gold" type="button">🎁 20</button>
        </div>
      </main>

      <!-- Right Online Users -->
      <aside class="right-panel">
        <div class="sec-hdr">Online</div>
        <div id="onlineList"></div>
      </aside>
    </div>
  </div>

  <!-- ADMIN MODAL -->
  <div id="admModal" class="modal-bg hidden">
    <div class="modal-box">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
        <strong>Admin Moderation</strong>
        <button id="closeAdmModal" class="tbtn" type="button">✕</button>
      </div>
      <div class="tiny" style="font-weight:700; margin-bottom:4px;">ACTIVE USERS</div>
      <div id="admUserList"></div>
      <div class="tiny" style="font-weight:700; margin-top:12px;">BANNED LIST</div>
      <div id="admBanList"></div>
    </div>
  </div>

  <script>
    const DB = "https://safekids-chat-default-rtdb.firebaseio.com";
    const AVS = ["😎", "🦊", "🐼", "🚀", "👑", "⚡"];
    const RANKS = ["Member", "Bronze", "Gold", "VIP", "Diamond", "Super VIP", "Moderator", "Room Manager"];
    const VIP_OR_ABOVE = ["VIP", "Diamond", "Super VIP", "Moderator", "Room Manager", "Admin"];
    const ADMIN_KEY = "ADMIN123";

    const STICKERS = [
      { title: "Fire", url: "https://media.giphy.com/media/26AHONQ79FdWTrAIy/giphy.gif" },
      { title: "Laugh", url: "https://media.giphy.com/media/JIX9t1j0ZtnJetCPas/giphy.gif" },
      { title: "GG Win", url: "https://media.giphy.com/media/l0amJz5bNYuyn7Pxe/giphy.gif" },
      { title: "Shock", url: "https://media.giphy.com/media/3o7abKhOpu0NwenH3O/giphy.gif" },
      { title: "Pro", url: "https://media.giphy.com/media/l0MYt5jPR6QX5pnqM/giphy.gif" },
      { title: "Nice", url: "https://media.giphy.com/media/111ebonMs90YLu/giphy.gif" }
    ];

    let devId = localStorage.getItem("skc_dev_clean3");
    if (!devId) {
      devId = "DEV-" + Math.random().toString(36).slice(2, 7).toUpperCase();
      localStorage.setItem("skc_dev_clean3", devId);
    }

    let chosenAv = AVS[0], me = null, activeTab = "gifs";
    let users = {}, banned = {}, ranks = {}, stats = {}, msgs = {};

    const avGrid = document.getElementById("avGrid");
    AVS.forEach((em, idx) => {
      const b = document.createElement("button");
      b.type = "button"; b.className = "av" + (idx === 0 ? " on" : ""); b.textContent = em;
      b.onclick = () => {
        chosenAv = em;
        document.querySelectorAll(".av").forEach(x => x.classList.remove("on"));
        b.classList.add("on");
      };
      avGrid.appendChild(b);
    });

    const admToggle = document.getElementById("admToggle");
    const admKeyWrap = document.getElementById("admKeyWrap");
    function toggleAdmKey() { admKeyWrap.classList.toggle("hidden", !admToggle.checked); }
    admToggle.addEventListener("change", toggleAdmKey);
    admToggle.addEventListener("click", toggleAdmKey);

    const kOf = s => encodeURIComponent(String(s || "").toLowerCase().trim());
    const rankOf = u => !u ? "Member" : (u.isAdmin ? "Admin" : (ranks[kOf(u.name)] || "Member"));

    async function dbGet(p) { const r = await fetch(`${DB}/${p}.json`); return r.ok ? await r.json() : null; }
    async function dbPut(p, d) { await fetch(`${DB}/${p}.json`, { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify(d) }); }
    async function dbDel(p) { await fetch(`${DB}/${p}.json`, { method: "DELETE" }); }

    function paintMediaTiles(items) {
      const box = document.getElementById("gifResults");
      box.innerHTML = "";
      items.forEach(item => {
        const tile = document.createElement("div");
        tile.className = "g-tile";
        tile.innerHTML = `<img src="${item.url}" alt="" /><div>${item.title}</div>`;
        tile.onclick = async () => {
          if (!me || !VIP_OR_ABOVE.includes(rankOf(me))) {
            return alert("GIFs aur Stickers free sirf VIP ya usse upar ke rank par send hote hain.");
          }
          document.getElementById("gifPopup").classList.add("hidden");
          await sendMessage({ text: item.title, img: item.url }, false);
        };
        box.appendChild(tile);
      });
    }

    async function loadMedia(query = "") {
      const q = query.trim();
      if (activeTab === "stickers") {
        const t = q.toLowerCase();
        const list = STICKERS.filter(x => !t || x.title.toLowerCase().includes(t));
        paintMediaTiles(list.length ? list : STICKERS);
        return;
      }
      try {
        const url = q
          ? `https://g.tenor.com/v1/search?q=${encodeURIComponent(q + " meme gif")}&key=LIVDSRZULELA&limit=12`
          : `https://g.tenor.com/v1/trending?key=LIVDSRZULELA&limit=12`;
        const res = await fetch(url);
        const data = await res.json();
        const list = (data.results || []).map(x => {
          const g = x.media && x.media[0] && (x.media[0].tinygif || x.media[0].gif);
          return g ? { title: x.content_description || q || "GIF", url: g.url } : null;
        }).filter(Boolean);
        if (list.length) return paintMediaTiles(list);
      } catch (_) {}
      paintMediaTiles(STICKERS);
    }

    loadMedia("");

    document.getElementById("tabGifs").onclick = () => {
      activeTab = "gifs";
      document.getElementById("tabGifs").classList.add("active");
      document.getElementById("tabStickers").classList.remove("active");
      loadMedia(document.getElementById("gifSearchInp").value);
    };
    document.getElementById("tabStickers").onclick = () => {
      activeTab = "stickers";
      document.getElementById("tabStickers").classList.add("active");
      document.getElementById("tabGifs").classList.remove("active");
      loadMedia(document.getElementById("gifSearchInp").value);
    };
    document.getElementById("gifSearchInp").addEventListener("input", e => loadMedia(e.target.value));
    document.getElementById("openGifBtn").onclick = () => document.getElementById("gifPopup").classList.toggle("hidden");
    document.getElementById("closeGifPopup").onclick = () => document.getElementById("gifPopup").classList.add("hidden");

    function getYtId(val) {
      const s = (val || "").trim();
      if (/^[a-zA-Z0-9_-]{11}$/.test(s)) return s;
      const m = s.match(/(?:v=|youtu\.be\/|embed\/|shorts\/)([a-zA-Z0-9_-]{11})/);
      return m ? m[1] : null;
    }

    document.getElementById("sendYtBtn").onclick = async () => {
      const id = getYtId(document.getElementById("ytUrlInp").value);
      if (!id) return alert("Valid YouTube link ya 11-char ID dein.");
      document.getElementById("ytUrlInp").value = "";
      await sendMessage({ text: "YouTube Video", yt: id }, false);
    };

    document.getElementById("sendGiftBtn").onclick = async () => {
      if (!me) return;
      const to = document.getElementById("giftUserInp").value.trim();
      if (!to) return;
      const cost = 20;
      const myK = kOf(me.name);
      const mySt = stats[myK] || { exp: 0, coins: 0 };

      if (!me.isAdmin) {
        if (Number(mySt.coins || 0) < cost) return alert("Coins kam hain. Chat karke coins kamayein.");
        await dbPut(`stats/${myK}`, { exp: Number(mySt.exp || 0), coins: Number(mySt.coins || 0) - cost });
      }

      const toK = kOf(to);
      const toSt = stats[toK] || { exp: 0, coins: 0 };
      await dbPut(`stats/${toK}`, { exp: Number(toSt.exp || 0) + 10, coins: Number(toSt.coins || 0) + cost });

      document.getElementById("giftUserInp").value = "";
      await sendMessage({ text: `🎁 Sent 20 Coins Gift to ${to}` }, false);
    };

    async function syncLoop() {
      const [u, b, r, s, m] = await Promise.all([
        dbGet("users"), dbGet("banned"), dbGet("ranks"), dbGet("stats"), dbGet("messages")
      ]);
      users = u || {}; banned = b || {}; ranks = r || {}; stats = s || {}; msgs = m || {};

      if (me && !me.isAdmin) {
        const isBan = Object.values(banned).some(x => x && (x.devId === devId || (x.name && x.name.toLowerCase() === me.name.toLowerCase())));
        const isAct = Object.values(users).some(x => x && x.name === me.name && x.devId === devId);
        if (isBan || !isAct) {
          me = null;
          document.getElementById("roomScreen").classList.add("hidden");
          document.getElementById("entryScreen").classList.remove("hidden");
          document.getElementById("entryErr").textContent = isBan ? "Banned by Admin." : "Kicked by Admin.";
        }
      }
      renderRoom();
    }

    document.getElementById("enterBtn").onclick = async () => {
      const name = document.getElementById("nickInp").value.trim();
      const room = document.getElementById("roomSel").value;
      const err = document.getElementById("entryErr");
      err.textContent = "";
      if (!name) return (err.textContent = "Nickname likhein.");

      const [b, u, r, s] = await Promise.all([dbGet("banned"), dbGet("users"), dbGet("ranks"), dbGet("stats")]);
      banned = b || {}; users = u || {}; ranks = r || {}; stats = s || {};

      const isBan = Object.values(banned).some(x => x && (x.devId === devId || (x.name && x.name.toLowerCase() === name.toLowerCase())));
      if (isBan && !admToggle.checked) return (err.textContent = "Banned.");

      let isAdmin = false;
      if (admToggle.checked) {
        if (document.getElementById("admKeyInp").value !== ADMIN_KEY) return (err.textContent = "Wrong key (ADMIN123).");
        isAdmin = true;
      }

      const otherOnDev = Object.values(users).find(x => x && x.devId === devId && x.name.toLowerCase() !== name.toLowerCase());
      if (!isAdmin && otherOnDev) return (err.textContent = `1 device = 1 account (${otherOnDev.name} active).`);

      for (const [key, val] of Object.entries(users)) {
        if (val && val.name && val.name.toLowerCase() === name.toLowerCase() && key !== devId) {
          await dbDel("users/" + key);
        }
      }

      const rk = isAdmin ? "Admin" : (ranks[kOf(name)] && ranks[kOf(name)] !== "Admin" ? ranks[kOf(name)] : "Member");
      await dbPut("ranks/" + kOf(name), rk);
      if (!stats[kOf(name)]) await dbPut("stats/" + kOf(name), { exp: 0, coins: 0 });

      me = { name, av: chosenAv, room, isAdmin, devId };
      await dbPut("users/" + devId, me);

      document.getElementById("entryScreen").classList.add("hidden");
      document.getElementById("roomScreen").classList.remove("hidden");
      renderRoom();
    };

    function renderRoom() {
      if (!me) return;
      const mySt = stats[kOf(me.name)] || { exp: 0, coins: 0 };
      document.getElementById("roomHeading").textContent = `${me.av} ${me.name} — ${me.room}`;
      document.getElementById("rankChip").textContent = rankOf(me);
      document.getElementById("myExp").textContent = mySt.exp || 0;
      document.getElementById("myCoins").textContent = me.isAdmin ? "∞" : (mySt.coins || 0);
      document.getElementById("openAdmBtn").classList.toggle("hidden", !me.isAdmin);

      const uBox = document.getElementById("onlineList");
      uBox.innerHTML = "";
      Object.values(users).forEach(u => {
        if (!u) return;
        const st = stats[kOf(u.name)] || { exp: 0, coins: 0 };
        const div = document.createElement("div");
        div.className = "u-row";
        div.innerHTML = `
          <div>
            <strong>${u.av} ${u.name}</strong> <span class="chip">${rankOf(u)}</span>
            <div class="tiny">EXP ${st.exp || 0} • Coins ${u.isAdmin ? "∞" : (st.coins || 0)}</div>
          </div>
        `;
        uBox.appendChild(div);
      });

      const feed = document.getElementById("chatFeed");
      feed.innerHTML = "";
      Object.values(msgs[kOf(me.room)] || {}).forEach(m => {
        if (!m) return;
        const item = document.createElement("div");
        item.className = "bubble-item";
        const img = m.img ? `<img class="b-img" src="${m.img}" alt="" />` : "";
        const yt = m.yt ? `<iframe class="b-yt" src="https://www.youtube.com/embed/${m.yt}" allowfullscreen></iframe>` : "";
        item.innerHTML = `
          <div class="b-meta"><strong>${m.av} ${m.sender}</strong><span class="chip">${m.role}</span><span class="tiny">${m.time || ""}</span></div>
          <div class="b-text">${m.text || ""}</div>${img}${yt}
        `;
        feed.appendChild(item);
      });
      feed.scrollTop = feed.scrollHeight;

      if (!document.getElementById("admModal").classList.contains("hidden")) renderAdmModal();
    }

    async function sendMessage({ text = "", img = "", yt = "" }, earnChat = true) {
      if (!me) return;
      const k = kOf(me.name);
      if (earnChat) {
        const prev = stats[k] || { exp: 0, coins: 0 };
        const next = { exp: Number(prev.exp || 0) + 10, coins: me.isAdmin ? "∞" : Number(prev.coins || 0) + 5 };
        stats[k] = next;
        await dbPut("stats/" + k, next);
      }
      const id = "MSG_" + Date.now();
      const payload = {
        sender: me.name, av: me.av, role: rankOf(me), text, img, yt,
        time: new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })
      };
      msgs[kOf(me.room)] = msgs[kOf(me.room)] || {};
      msgs[kOf(me.room)][id] = payload;
      await dbPut(`messages/${kOf(me.room)}/${id}`, payload);
      renderRoom();
    }

    document.getElementById("msgForm").onsubmit = async e => {
      e.preventDefault();
      const inp = document.getElementById("msgInp");
      const val = inp.value.trim();
      if (!val) return;
      inp.value = "";
      await sendMessage({ text: val }, true);
    };

    const admModal = document.getElementById("admModal");
    document.getElementById("openAdmBtn").onclick = () => { renderAdmModal(); admModal.classList.remove("hidden"); };
    document.getElementById("closeAdmModal").onclick = () => admModal.classList.add("hidden");

    function renderAdmModal() {
      const uList = document.getElementById("admUserList");
      const bList = document.getElementById("admBanList");
      uList.innerHTML = ""; bList.innerHTML = "";

      const others = Object.entries(users).filter(([k, u]) => u && k !== devId);
      if (!others.length) uList.innerHTML = `<div class="tiny">No other users.</div>`;
      others.forEach(([key, u]) => {
        const row = document.createElement("div"); row.className = "mod-item";
        row.innerHTML = `<div><strong>${u.name}</strong><div class="tiny">${key}</div></div>`;
        const acts = document.createElement("div"); acts.style.display = "flex"; acts.style.gap = "4px";

        const sel = document.createElement("select"); sel.className = "sel"; sel.style.width = "110px"; sel.style.padding = "4px";
        RANKS.forEach(r => { const o = document.createElement("option"); o.value = r; o.textContent = r; if ((ranks[kOf(u.name)] || "Member") === r) o.selected = true; sel.appendChild(o); });
        sel.onchange = async () => { await dbPut("ranks/" + kOf(u.name), sel.value); syncLoop(); };

        const kick = document.createElement("button"); kick.type = "button"; kick.className = "tbtn gold"; kick.textContent = "Kick";
        kick.onclick = async () => { await dbDel("users/" + key); delete users[key]; renderRoom(); };

        const ban = document.createElement("button"); ban.type = "button"; ban.className = "tbtn red"; ban.textContent = "Ban";
        ban.onclick = async () => {
          await dbDel("users/" + key); delete users[key];
          const bObj = { name: u.name, devId: u.devId || key };
          banned[key] = bObj;
          await dbPut("banned/" + key, bObj);
          renderRoom();
        };

        acts.append(sel, kick, ban); row.appendChild(acts); uList.appendChild(row);
      });

      const bEnt = Object.entries(banned);
      if (!bEnt.length) bList.innerHTML = `<div class="tiny">No banned users.</div>`;
      bEnt.forEach(([k, b]) => {
        if (!b) return;
        const row = document.createElement("div"); row.className = "mod-item";
        row.innerHTML = `<div><strong>${b.name}</strong> <span class="tiny">(${b.devId})</span></div>`;
        const unban = document.createElement("button"); unban.type = "button"; unban.className = "tbtn grn"; unban.textContent = "Unban";
        unban.onclick = async () => { await dbDel("banned/" + k); delete banned[k]; renderAdmModal(); };
        row.appendChild(unban); bList.appendChild(row);
      });
    }

    document.getElementById("logoutBtn").onclick = async () => {
      if (me) { await dbDel("users/" + devId); delete users[devId]; }
      me = null;
      document.getElementById("roomScreen").classList.add("hidden");
      document.getElementById("entryScreen").classList.remove("hidden");
    };

    setInterval(syncLoop, 2500);
  </script>
</body>
</html>
